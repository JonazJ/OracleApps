name: build

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore OracleApps.sln

      - name: Build
        run: dotnet build OracleApps.sln --configuration Release --no-restore

      - name: Publish
        run: >
          dotnet publish src/OracleApps.Launcher/OracleApps.Launcher.csproj
          --configuration Release --runtime win-x64 --self-contained false
          --output publish

      - uses: actions/upload-artifact@v4
        with:
          name: OracleApps.Launcher
          path: publish
